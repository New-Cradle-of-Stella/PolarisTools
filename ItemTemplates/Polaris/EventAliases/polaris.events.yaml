# 这份默认配置是从游戏 0.29j 自带的 evt/__vp_person.dat + evt/__vp_talker_pos.dat 直接解析出来的，
# 不是手写的猜测。
#
# positions 可以直接用：talker 就是游戏自己的站位码（L/R/C/CL/CR/...），@char 里写
# pos:L、pos:CR 这些开箱即用，不用改。
#
# actors 的 raw 也是从 __vp_person.dat 抠出来的真实底层角色码（比如 Noel 对应的实际是单字母 "n"），
# 可以直接用；但 poses 抠不出来——游戏的姿势不是一个固定的命名集合，是 PixelLiner 引擎按
# "姿势/眼/嘴/..."分层组合出来的程序化代码，没有一份"姿势名字典"可以生成。下面每个角色只留了一条从
# 游戏自带 726 个 .cmd 脚本里抓到的真实可用示例（键名 Sample），保证这份默认配置至少能编译过、能在
# 游戏里正确显示；写自己的剧情时请把 Sample 换成/新增你真正要用的姿势——找真实姿势码最快的办法是去
# 游戏安装目录 StreamingAssets/evt 底下按 raw 值搜 "PIC <raw> "，把搜到的那个长字符串抄过来用。
actors:
  Noel:
    raw: n
    poses:
      Sample: a_1/a00L1R1__F1__f1__m1__b1__u0
